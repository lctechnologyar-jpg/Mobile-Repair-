<!DOCTYPE html>
<html lang="es">

<head>

































































































































































































































































































































































































<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LC ONE PLAYER</title>

<meta
name="description"
content="LC ONE PLAYER - Servicio técnico, venta de celulares, accesorios y entretenimiento digital.">

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"

<link

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =========================================================
RESET
========================================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

scroll-behavior:smooth;

}

html{

overflow-x:hidden;

}

/* =========================================================
BODY
========================================================= */

body{

font-family:"Inter",sans-serif;

background:#05070d;

color:#ffffff;

overflow-x:hidden;

position:relative;

}

/* =========================================================
BACKGROUND
========================================================= */

.bg-animation{

position:fixed;

inset:0;

z-index:-20;

overflow:hidden;

animation:hueRotate 18s linear infinite;

}

@keyframes hueRotate{

0%{

filter:hue-rotate(0deg);

}

100%{

filter:hue-rotate(360deg);

}

}

.light{

position:absolute;

border-radius:50%;

filter:blur(120px);

opacity:.25;

animation:float 14s infinite alternate;

}

.light1{

width:520px;

height:520px;

background:#00cfff;

top:-120px;

left:-120px;

}

.light2{

width:450px;

height:450px;

background:#004cff;

bottom:-100px;

right:-100px;

}

.light3{

width:350px;

height:350px;

background:#00fff2;

top:45%;

left:45%;

}

@keyframes float{

0%{

transform:translate(0,0) scale(1);

}

100%{

transform:translate(120px,-90px) scale(1.3);

}

}

/* =========================================================
CURSOR
========================================================= */

.cursor{

width:18px;

height:18px;

border-radius:50%;

background:#00cfff;

position:fixed;

pointer-events:none;

z-index:999999;

transform:translate(-50%,-50%);

box-shadow:
0 0 20px #00cfff,
0 0 50px #00cfff;

}

/* =========================================================
LOADER
========================================================= */

.loader{

position:fixed;

inset:0;

background:#05070d;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

z-index:999999;

transition:1.5s;

}

.loader.hide{

opacity:0;

pointer-events:none;

}

.loader-door{

position:absolute;

top:0;

width:50%;

height:100%;

background:#05070d;

transition:1.8s cubic-bezier(.77,0,.18,1);

z-index:5;

}

.loader-door.left{

left:0;

border-right:1px solid #00cfff22;

}

.loader-door.right{

right:0;

border-left:1px solid #00cfff22;

}

.loader.hide .loader-door.left{

transform:translateX(-100%);

}

.loader.hide .loader-door.right{

transform:translateX(100%);

}

.loader-content{

position:relative;

z-index:10;

text-align:center;

}

.loader-title{

font-family:"Orbitron",sans-serif;

font-size:5rem;

letter-spacing:10px;

text-shadow:
0 0 25px #00cfff,
0 0 60px #00cfff;

animation:loaderPulse 2s infinite;

}

.loader-line{

width:0;

height:4px;

background:#00cfff;

margin:25px auto;

border-radius:20px;

box-shadow:
0 0 20px #00cfff,
0 0 50px #00cfff;

animation:loaderLine 2.4s forwards;

}

.loader-sub{

letter-spacing:8px;

color:#9aa6c0;

font-size:.95rem;

}

@keyframes loaderPulse{

0%{

transform:scale(1);

opacity:.7;

}

50%{

transform:scale(1.08);

opacity:1;

}

100%{

transform:scale(1);

opacity:.7;

}

}

@keyframes loaderLine{

100%{

width:300px;

}

}

/* =========================================================
HEADER
========================================================= */

header{

position:fixed;

top:0;

left:0;

width:100%;

height:95px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 50px;

background:rgba(5,7,13,.7);

backdrop-filter:blur(15px);

border-bottom:1px solid rgba(255,255,255,.05);

z-index:999;

}

/* =========================================================
LOGO
========================================================= */

.logo{

display:flex;

align-items:center;

gap:18px;

text-decoration:none;

}

.logo-icon{

width:68px;

height:68px;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

font-family:"Orbitron",sans-serif;

font-size:1.6rem;

font-weight:700;

color:#fff;

background:#09111f;

position:relative;

overflow:hidden;

box-shadow:
0 0 25px #00cfff66,
0 0 60px #00cfff33;

animation:logoGlow 4s infinite alternate;

}

.logo-icon::before{

content:"";

position:absolute;

width:220%;

height:220%;

background:
conic-gradient(
transparent,
#00cfff,
transparent,
#00fff2,
transparent,
#0066ff,
transparent
);

animation:rotate 5s linear infinite;

}

.logo-icon::after{

content:"";

position:absolute;

inset:2px;

border-radius:18px;

background:#09111f;

}

.logo-icon span{

position:relative;

z-index:2;

}

@keyframes rotate{

100%{

transform:rotate(360deg);

}

}

@keyframes logoGlow{

100%{

box-shadow:
0 0 40px #00fff2,
0 0 80px #00cfff66;

}

}

/* =========================================================
FORMULARIO
========================================================= */

#thankYouMessage{

display:none;

color:#00cfff;

margin-top:15px;

font-weight:600;

}

/* =========================================================
BOTONES
========================================================= */

.btn{

padding:16px 32px;

border-radius:16px;

font-size:.95rem;

font-weight:600;

text-decoration:none;

transition:.35s;

border:none;

cursor:pointer;

}

.btn-primary{

background:#00cfff;

color:#000;

box-shadow:
0 0 30px #00cfff55;

}

.btn-primary:hover{

transform:translateY(-6px);

}

/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:760px){

header{

padding:0 24px;

}

}

</style>

</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="bg-animation">

<div class="light light1"></div>

<div class="light light2"></div>

<div class="light light3"></div>

</div>

<div class="loader" id="loader">

<div class="loader-door left"></div>

<div class="loader-door right"></div>

<div class="loader-content">

<h1 class="loader-title">

LC ONE PLAYER

</h1>

<div class="loader-line"></div>

<p class="loader-sub">

TECNOLOGÍA

</p>

</div>

</div>

<header>

<a href="#inicio" class="logo">

<div class="logo-icon">

<span>LC</span>

</div>

</a>

</header>

<section id="contacto">

<div class="contact-form reveal">

<form id="contactForm">

<input
type="hidden"
name="access_key"
value="9fc0c2ae-3ca5-4c7e-9fe4-389ce9bc0c69">

<input
type="text"
name="name"
placeholder="Tu nombre"
required>

<input
type="email"
name="email"
placeholder="Tu correo electrónico"
required>

<textarea
name="message"
placeholder="Tu mensaje"
required></textarea>

<button
type="submit"
class="btn btn-primary">

Enviar

</button>

</form>

<div id="thankYouMessage">

¡Gracias por tu consulta! Te responderemos pronto.

</div>

</div>

</section>

<script>

/* =========================================================
LOADER
========================================================= */

window.addEventListener("load",()=>{

setTimeout(()=>{

document.getElementById("loader").classList.add("hide");

},2600);

});

/* =========================================================
CURSOR
========================================================= */

const cursor = document.getElementById("cursor");

window.addEventListener("mousemove",(e)=>{

cursor.style.left = e.clientX + "px";

cursor.style.top = e.clientY + "px";

});

/* =========================================================
FORMULARIO WEB3FORMS
========================================================= */

const form = document.getElementById("contactForm");

const thankYou = document.getElementById("thankYouMessage");

form.addEventListener("submit", async function(e){

e.preventDefault();

const formData = new FormData(form);

try{

const response = await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
body:formData
}
);

const result = await response.json();

if(result.success){

thankYou.style.display = "block";

form.reset();

}else{

alert("Error al enviar mensaje");

}

}catch(error){

alert("Error de conexión");

}

});

</script>

</body>

</html>
